services:
  fed:
    image: split_learning
    runtime: nvidia
    gpus: all
    command: python -m split-learning --mode splitfed_v1_custom_cut --fed --config config.yaml
    working_dir: /src
    volumes:
      - ./logs:/src/logs
      - ./models:/src/models
      - ./config.yaml:/src/config.yaml

  split:
    image: split_learning
    runtime: nvidia
    gpus: all
    command: python -m split-learning --mode splitfed_v1_custom_cut --server --extra 3,7,7 --config config.yaml
    working_dir: /src
    volumes:
      - ./logs:/src/logs
      - ./models:/src/models
      - ./config.yaml:/src/config.yaml

  client1:
    image: split_learning
    cpus: 0.5
    mem_limit: 2g
    runtime: nvidia
    gpus: all
    command: python -m split-learning --mode splitfed_v1_custom_cut --client 1 --extra 3 --config config.yaml
    working_dir: /src
    volumes:
      - ./logs:/src/logs
      - ./models:/src/models
      - ./config.yaml:/src/config.yaml

  client2:
    image: split_learning
    cpus: 0.5
    mem_limit: 2g
    runtime: nvidia
    gpus: all
    command: python -m split-learning --mode splitfed_v1_custom_cut --client 2 --extra 7 --config config.yaml
    working_dir: /src
    volumes:
      - ./logs:/src/logs
      - ./models:/src/models
      - ./config.yaml:/src/config.yaml

  client3:
    image: split_learning
    cpus: 0.5
    mem_limit: 2g
    runtime: nvidia
    gpus: all
    command: python -m split-learning --mode splitfed_v1_custom_cut --client 3 --extra 7 --config config.yaml
    working_dir: /src
    volumes:
      - ./logs:/src/logs
      - ./models:/src/models
      - ./config.yaml:/src/config.yaml