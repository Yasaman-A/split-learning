services:
  fed:
    image: split-learning
    network_mode: host
    runtime: nvidia
    gpus: all
    command: python -m split-learning --mode splitfed_v2 --fed --config config.yaml
    working_dir: /src
    volumes:
      - ./logs:/src/logs
      - ./models:/src/models
      - ./config.yaml:/src/config.yaml

  split:
    image: split-learning
    network_mode: host
    runtime: nvidia
    gpus: all
    command: python -m split-learning --mode splitfed_v2 --server --config config.yaml
    working_dir: /src
    volumes:
      - ./logs:/src/logs
      - ./models:/src/models
      - ./config.yaml:/src/config.yaml

  client1:
    image: split-learning
    network_mode: host
    cpus: 2
    mem_limit: 2g
    runtime: nvidia
    gpus: all
    command: python -m split-learning --mode splitfed_v2 --client 1 --config config.yaml
    working_dir: /src
    volumes:
      - ./logs:/src/logs
      - ./models:/src/models
      - ./config.yaml:/src/config.yaml

