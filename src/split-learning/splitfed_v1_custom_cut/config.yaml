logging: true
log_dir: "./logs"
model_dir: "./models"
log_steps: 50

#cpu OR gpu
device: gpu
client_total: 3
epoch: 5
round: 60
batch_size: 32

patience: 5
test_cut_layer: 4

# n for no_split, s: for getting split i from data server, Any number for the number of i.i.d splits.
split_type: s
split_server: 
  server_ip: tcp://10.128.0.8
  server_start_port: 5555
fed_server:
  server_ip: tcp://10.128.0.3
  server_start_port: 4445
data_server:
  server_address: http://10.128.0.3:8000
  output_file: output.pkl