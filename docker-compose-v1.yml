services:
  fed:
    image: split-learning
    network_mode: host
    runtime: nvidia
    gpus: all
    command: python -m split-learning --mode splitfed_v1_custom_cut --fed --config config.yaml
    working_dir: /src
    volumes:
      - ./logs:/src/logs
      - ./models:/src/models
      - ./config.yaml:/src/config.yaml

  split:
    image: split-learning
    network_mode: host
    runtime: nvidia
    gpus: all
    command: python -m split-learning --mode splitfed_v1_custom_cut --server --extra 3,3,4,5,5 --config config.yaml 1>/dev/null
    working_dir: /src
    volumes:
      - ./logs:/src/logs
      - ./models:/src/models
      - ./config.yaml:/src/config.yaml

  client1:
    image: split-learning
    network_mode: host
    cpus: 2
    mem_limit: 2g
    runtime: nvidia
    gpus: all
    command: python -m split-learning --mode splitfed_v1_custom_cut --client 1 --extra 3 --config config.yaml
    working_dir: /src
    volumes:
      - ./logs:/src/logs
      - ./models:/src/models
      - ./config.yaml:/src/config.yaml

  client2:
